<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/chow-hall-tray.svg" />
  <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/oswald-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping - Chow Hall</title>
  <script type="module" src="/src/js/shopping.js" defer></script>
</head>

<body>
  <div id="site-header"></div>
  <main id="app"></main>
  <template id="shopping-page-template">
    <div class="shopping-page">
      <section class="home-intro shopping-intro" aria-labelledby="shopping-title">
        <p class="home-kicker">Your gathering</p>
        <h1 id="shopping-title">Shopping</h1>
        <p>Review what you need, record purchases, and keep your available stock up to date.</p>
      </section>
      <section class="shopping-list-management" aria-labelledby="shopping-list-title">
        <h2 id="shopping-list-title">Shopping list</h2>
        <p>Enter the amount bought to add it to available stock; any remaining need stays on your list.</p>
        <p class="shopping-list-message" role="status" aria-live="polite"></p>
        <ul class="shopping-list-items"></ul>
      </section>
    </div>
  </template>
  <div id="site-footer"></div>
</body>

</html>
