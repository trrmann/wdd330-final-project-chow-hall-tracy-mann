<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/chow-hall-tray.svg" />
  <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/oswald-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chow Hall - by Tracy Robert Mann - WDD330 Term 5 Final Project</title>
  <script type="module" src="/src/js/main.js" defer></script>
</head>

<body>
  <div id="site-header"></div>
  <main id="app"></main>
  <template id="home-page-template">
    <div class="home-page">
      <section class="home-intro" aria-labelledby="home-title">
        <div>
          <p class="home-kicker">Meal planning for gatherings</p>
          <h1 id="home-title">Chow Hall</h1>
          <p>Plan a meal, keep track of your pantry, and know what to pick up.</p>
        </div>
        <a class="primary-action" href="/MealPlan/">Plan a meal</a>
      </section>
      <div class="home-dashboard"></div>
    </div>
  </template>
  <template id="weekly-meal-plan-template">
    <section class="dashboard-panel dashboard-panel-week" id="weekly-meal-plan" aria-labelledby="week-title">
      <div class="panel-heading">
        <div>
          <a class="panel-kicker-anchor" href="/">
            <p class="panel-kicker">This week</p>
          </a>
          <h2 id="week-title">Weekly Meal Plan</h2>
        </div>
        <a class="panel-link" href="/MealPlan/">Open meal plan</a>
      </div>
      <ol class="week-strip"></ol>
    </section>
  </template>
  <template id="meal-plan-day-template">
    <li class="week-strip-day">
      <span class="week-strip-label"></span>
      <span class="week-strip-status" role="img"></span>
    </li>
  </template>
  <template id="shopping-list-dashboard-template">
    <section class="dashboard-panel dashboard-panel-shopping" id="shopping-list" aria-labelledby="shopping-title">
      <div class="panel-heading">
        <div>
          <p class="panel-kicker">To pick up</p>
          <h2 id="shopping-title">Shopping List</h2>
        </div>
        <span class="item-count"><span class="item-count-number"></span> items</span>
      </div>
      <ul class="shopping-items"></ul>
      <button class="shopping-dashboard-purchase" type="button" disabled>Purchase selected</button>
      <p class="shopping-dashboard-message" role="status" aria-live="polite"></p>
    </section>
  </template>
  <template id="shopping-list-item-template">
    <li><label><input class="shopping-item-select" type="checkbox" /> <span class="shopping-item-name"></span></label></li>
  </template>
  <template id="inventory-status-dashboard-template">
    <section class="dashboard-panel dashboard-panel-inventory" id="inventory-status" aria-labelledby="inventory-title">
      <div class="panel-heading">
        <div>
          <p class="panel-kicker">Pantry</p>
          <h2 id="inventory-title">Inventory</h2>
        </div>
        <a class="panel-link" href="/Inventory/">Review list</a>
      </div>
      <ul class="inventory-items"></ul>
    </section>
  </template>
  <template id="inventory-item-template">
    <li><span class="inventory-item-name"></span></li>
  </template>
  <template id="low-stock-dashboard-template">
    <section class="dashboard-panel dashboard-panel-low-stock" id="low-stock-status" aria-labelledby="low-stock-title">
      <div class="panel-heading">
        <div>
          <p class="panel-kicker">Planned meals</p>
          <h2 id="low-stock-title">Low stock</h2>
        </div>
      </div>
      <ul class="low-stock-items"></ul>
      <p class="low-stock-message" role="status" aria-live="polite"></p>
    </section>
  </template>
  <template id="recipe-suggestions-dashboard-template">
    <section class="dashboard-panel dashboard-panel-recipes" id="recipe-search" aria-labelledby="recipe-title">
      <div class="panel-heading">
        <div>
          <p class="panel-kicker">From TheMealDB</p>
          <h2 id="recipe-title">Recipes</h2>
        </div>
      </div>
      <ul class="recipe-suggestions" data-recipe-list></ul>
    </section>
  </template>
  <template id="recipe-suggestion-template">
    <li class="recipe-suggestion-item">
      <a href="/Recipe/" class="recipe-suggestion">{placeholder}</a>
      <a href="/Search/" class="recipe-suggestion-deploy">Deploy</a>
      <button type="button" class="recipe-suggestion-dismiss">Dismiss</button>
    </li>
  </template>
  <div id="site-footer"></div>
</body>

</html>
